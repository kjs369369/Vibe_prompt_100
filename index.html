<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>바이브 코딩 시작 프롬프트 100선 — AICLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Bebas+Neue&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --black: #000000;
  --white: #FFFFFF;
  --red: #FF0000;
  --royal-blue: #0048BA;
  --card-bg: #111111;
  --card-hover: #1a1a1a;
  --text-gray: #AAAAAA;
  --text-dim: #666666;
  --font-title: 'Black Han Sans', sans-serif;
  --font-body: 'Noto Sans KR', sans-serif;
  --font-accent: 'Bebas Neue', sans-serif;
}

*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  background: var(--black);
  color: var(--white);
  font-family: var(--font-body);
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ===== KEYFRAMES ===== */
@keyframes slideUp {
  from { opacity: 0; transform: translateY(50px) scale(0.95); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes bounceIn {
  0% { opacity: 0; transform: translateY(50px) scale(0.8); }
  60% { opacity: 1; transform: translateY(-8px) scale(1.05); }
  80% { transform: translateY(3px) scale(0.98); }
  100% { transform: translateY(0) scale(1); }
}
@keyframes glowPulse {
  0%, 100% { text-shadow: 0 0 20px rgba(255,0,0,0.3), 0 0 40px rgba(255,0,0,0.1); }
  50% { text-shadow: 0 0 30px rgba(255,0,0,0.5), 0 0 60px rgba(255,0,0,0.2); }
}
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-10px); }
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-100%); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes ripple {
  0% { transform: scale(0); opacity: 0.6; }
  100% { transform: scale(2.5); opacity: 0; }
}
@keyframes cardReveal {
  from { opacity: 0; transform: translateX(-20px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes scanline {
  0% { background-position: 0 0; }
  100% { background-position: 0 100%; }
}
@keyframes typewriter {
  from { width: 0; }
  to { width: 100%; }
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-3px) rotate(-1deg); }
  75% { transform: translateX(3px) rotate(1deg); }
}
@keyframes copySuccess {
  0% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0; transform: translateY(-30px); }
}

/* ===== NOISE OVERLAY ===== */
body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 0;
}

/* ===== TOP BAR ===== */
.top-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 40px;
  z-index: 100;
}
.top-bar .brand {
  font-family: var(--font-accent);
  font-size: 28px;
  letter-spacing: 3px;
  color: var(--white);
  opacity: 0;
  transition: opacity 0.6s ease, transform 0.6s ease;
  transform: translateY(10px);
}
.top-bar .brand.show { opacity: 1; transform: translateY(0); }
.top-bar .brand span { color: var(--red); }
.btn-guide {
  background: transparent;
  border: 1px solid var(--text-dim);
  color: var(--text-gray);
  padding: 8px 20px;
  font-family: var(--font-body);
  font-size: 14px;
  cursor: pointer;
  transition: all 0.3s ease;
  opacity: 0;
  transform: translateY(10px);
}
.btn-guide.show { opacity: 1; transform: translateY(0); }
.btn-guide:hover {
  border-color: var(--red);
  color: var(--white);
  box-shadow: 0 0 15px rgba(255,0,0,0.2);
}

/* ===== INTRO OVERLAY ===== */
.intro-overlay {
  position: fixed;
  inset: 0;
  background: var(--black);
  z-index: 5000;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  transition: opacity 0.6s ease;
}
.intro-overlay.fade-out {
  opacity: 0;
  pointer-events: none;
}
.intro-overlay.hidden { display: none; }
.intro-counter {
  font-family: var(--font-accent);
  font-size: clamp(80px, 20vw, 200px);
  color: var(--red);
  line-height: 1;
  text-shadow: 0 0 40px rgba(255,0,0,0.4), 0 0 80px rgba(255,0,0,0.2);
}
.intro-text {
  font-family: var(--font-body);
  font-size: 16px;
  color: var(--text-dim);
  letter-spacing: 4px;
  margin-top: 16px;
}
.intro-bar {
  width: 200px;
  height: 2px;
  background: #222;
  margin-top: 30px;
  overflow: hidden;
  position: relative;
}
.intro-bar-fill {
  position: absolute;
  left: 0; top: 0; bottom: 0;
  background: var(--red);
  width: 0;
  transition: width 0.3s linear;
}

/* ===== HERO ===== */
.hero {
  position: relative;
  min-height: 70vh;
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  align-items: center;
  text-align: center;
  padding: 3vh 20px 40px;
  overflow: hidden;
  background: var(--black);
}

/* 스파이럴 캔버스 배경 */
.hero-canvas-wrap {
  position: absolute;
  inset: 0;
  z-index: 0;
  overflow: hidden;
}
.hero-canvas-wrap canvas {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
}

/* 이미지 오버레이 */
.hero-img-overlay {
  position: absolute;
  inset: 0;
  z-index: 1;
  background: url('JyvBZROg.jpeg') center center / cover no-repeat;
  opacity: 0.3;
  pointer-events: none;
}

.hero > *:not(.hero-canvas-wrap):not(.hero-img-overlay) {
  position: relative;
  z-index: 3;
}

.hero-title {
  font-family: var(--font-title);
  font-weight: 400;
  line-height: 1.35;
  margin-bottom: 30px;
  letter-spacing: 2px;
  -webkit-font-smoothing: subpixel-antialiased;
}
.hero-line {
  display: block;
  font-size: clamp(45px, 10vw, 126px);
  overflow: hidden;
  min-height: 1.3em;
  -webkit-text-stroke: 0;
  paint-order: stroke fill;
}
.hero-line .char {
  display: inline-block;
  opacity: 0;
  transform: translateY(50px) scale(0.8);
  transition: none;
}
.hero-line .char.show {
  opacity: 1;
  transform: translateY(0) scale(1);
  animation: bounceIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}
.hero-line .char.settled {
  opacity: 1;
  transform: none;
  animation: none;
}
.hero-line.accent {
  color: var(--red);
}
.hero-line.accent.glow {
  animation: glowPulse 3s ease-in-out infinite;
}

.hero-sub {
  font-family: var(--font-body);
  font-size: clamp(25px, 3.5vw, 46px);
  font-weight: 300;
  color: var(--royal-blue);
  letter-spacing: 2px;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.8s ease;
  margin-bottom: 10px;
}
.hero-sub.show {
  opacity: 1;
  transform: translateY(0);
}
.hero-sub-small {
  font-family: var(--font-body);
  font-size: clamp(21px, 2.8vw, 34px);
  font-weight: 300;
  color: var(--text-gray);
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.8s ease;
  margin-bottom: 50px;
}
.hero-sub-small.show {
  opacity: 1;
  transform: translateY(0);
}

.scroll-cta {
  position: relative;
  z-index: 10;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.8s ease;
}
.scroll-cta.show {
  opacity: 1;
  transform: translateY(0);
}
.scroll-cta a {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  color: var(--text-gray);
  text-decoration: none;
  font-size: 14px;
  letter-spacing: 1px;
  transition: color 0.3s;
}
.scroll-cta a:hover { color: var(--white); }
.scroll-cta .arrow {
  font-size: 24px;
  animation: float 2s ease-in-out infinite;
}

/* ===== STICKY HEADER ===== */
.sticky-header {
  position: fixed;
  top: 0; left: 0; right: 0;
  background: rgba(0,0,0,0.95);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--red);
  padding: 12px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 1000;
  transform: translateY(-100%);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.sticky-header.visible {
  transform: translateY(0);
}
.sticky-header .brand {
  font-family: var(--font-accent);
  font-size: 20px;
  letter-spacing: 2px;
}
.sticky-header .brand span { color: var(--red); }
.sticky-header .title {
  font-family: var(--font-title);
  font-size: 16px;
  color: var(--text-gray);
}
.btn-toggle-all {
  background: transparent;
  border: 1px solid var(--text-dim);
  color: var(--text-gray);
  padding: 6px 16px;
  font-family: var(--font-body);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.3s ease;
}
.btn-toggle-all:hover {
  border-color: var(--royal-blue);
  color: var(--white);
}

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  backdrop-filter: blur(5px);
  z-index: 2000;
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
}
.modal-overlay.active {
  opacity: 1;
  visibility: visible;
}
.modal {
  background: #0a0a0a;
  border: 1px solid #222;
  padding: 50px;
  max-width: 500px;
  width: 90%;
  position: relative;
  transform: scale(0.9);
  transition: transform 0.3s ease;
}
.modal-overlay.active .modal {
  transform: scale(1);
}
.modal h2 {
  font-family: var(--font-title);
  font-size: 28px;
  margin-bottom: 30px;
  color: var(--white);
}
.modal h2 span { color: var(--red); }
.modal-step {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  margin-bottom: 24px;
}
.modal-step-num {
  font-family: var(--font-accent);
  font-size: 36px;
  color: var(--royal-blue);
  line-height: 1;
  min-width: 36px;
}
.modal-step-text {
  font-size: 16px;
  color: var(--text-gray);
  line-height: 1.6;
  padding-top: 6px;
}
.modal-step-text strong { color: var(--white); }
.modal-close {
  position: absolute;
  top: 20px; right: 20px;
  background: none;
  border: none;
  color: var(--text-dim);
  font-size: 28px;
  cursor: pointer;
  transition: color 0.2s;
  line-height: 1;
}
.modal-close:hover { color: var(--white); }

/* ===== MAIN CONTENT ===== */
.main-content {
  max-width: 1100px;
  margin: 0 auto;
  padding: 40px 20px 60px;
}
.section-count {
  font-family: var(--font-accent);
  font-size: 14px;
  color: var(--text-dim);
  letter-spacing: 4px;
  text-align: center;
  margin-bottom: 60px;
  opacity: 0;
}
.section-count.visible {
  animation: fadeInUp 0.6s ease forwards;
}
.section-count span { color: var(--red); font-size: 24px; }

/* ===== ACCORDION ===== */
.accordion-item {
  margin-bottom: 2px;
}
.accordion-header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 18px 24px;
  background: #080808;
  cursor: pointer;
  transition: background 0.3s ease;
  user-select: none;
  border-left: 4px solid transparent;
}
.accordion-header:hover {
  background: #0e0e0e;
  border-left-color: var(--red);
}
.accordion-header.active {
  border-left-color: var(--red);
  background: #0e0e0e;
}
.accordion-icon {
  width: 12px;
  height: 12px;
  background: var(--text-dim);
  transition: all 0.3s ease;
  flex-shrink: 0;
}
.accordion-header:hover .accordion-icon,
.accordion-header.active .accordion-icon {
  background: var(--red);
  transform: scale(1.2);
}
.accordion-title {
  flex: 1;
  font-family: var(--font-title);
  font-size: 20px;
  letter-spacing: 1px;
}
.accordion-count {
  font-family: var(--font-accent);
  font-size: 16px;
  color: var(--text-dim);
  letter-spacing: 2px;
}
.accordion-arrow {
  font-size: 14px;
  color: var(--text-dim);
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  flex-shrink: 0;
}
.accordion-header.active .accordion-arrow {
  transform: rotate(90deg);
  color: var(--red);
}

.accordion-body {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.5s cubic-bezier(0.16, 1, 0.3, 1);
}
.accordion-body-inner {
  padding: 16px 0;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

/* ===== PROMPT CARD ===== */
.prompt-card {
  background: var(--card-bg);
  padding: 20px 24px;
  border-left: 3px solid transparent;
  transition: all 0.3s ease;
  position: relative;
  opacity: 0;
}
.prompt-card.revealed {
  animation: cardReveal 0.4s ease forwards;
}
.prompt-card:hover {
  background: var(--card-hover);
}
.prompt-card[data-level="쉬움"] { border-left-color: transparent; }
.prompt-card[data-level="쉬움"]:hover { border-left-color: var(--royal-blue); }
.prompt-card[data-level="보통"] { border-left-color: transparent; }
.prompt-card[data-level="보통"]:hover { border-left-color: var(--red); }

.card-top {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}
.badge {
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 500;
  padding: 2px 8px;
  letter-spacing: 0.5px;
}
.badge-easy {
  background: rgba(0, 72, 186, 0.2);
  color: var(--royal-blue);
  border: 1px solid rgba(0, 72, 186, 0.3);
}
.badge-normal {
  background: rgba(255, 0, 0, 0.15);
  color: var(--red);
  border: 1px solid rgba(255, 0, 0, 0.3);
}
.card-number {
  font-family: var(--font-accent);
  font-size: 14px;
  color: var(--text-dim);
  letter-spacing: 1px;
}
.card-title {
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 17px;
  line-height: 1.4;
  margin-bottom: 6px;
  color: var(--white);
}
.card-desc {
  font-size: 13px;
  color: var(--text-gray);
  line-height: 1.5;
  margin-bottom: 14px;
}
.btn-copy {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: 1px solid #333;
  color: var(--text-dim);
  padding: 5px 14px;
  font-family: var(--font-body);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
  position: relative;
}
.btn-copy:hover {
  border-color: var(--royal-blue);
  color: var(--royal-blue);
}
.btn-copy .copy-icon {
  font-size: 13px;
}
.copy-toast {
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  color: var(--royal-blue);
  font-weight: 500;
  pointer-events: none;
  animation: copySuccess 0.8s ease forwards;
  white-space: nowrap;
}

/* ===== PROMPT PREVIEW ===== */
.card-actions {
  display: flex;
  gap: 8px;
  align-items: center;
}
.btn-preview {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: transparent;
  border: 1px solid #333;
  color: var(--text-dim);
  padding: 5px 14px;
  font-family: var(--font-body);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.3s ease;
}
.btn-preview:hover {
  border-color: var(--red);
  color: var(--red);
}
.btn-preview.active {
  border-color: var(--red);
  color: var(--red);
}
.prompt-preview {
  max-height: 0;
  overflow: hidden;
  transition: max-height 0.4s ease, padding 0.4s ease;
  background: #0a0a0a;
  border-left: 2px solid #333;
  margin-top: 0;
  font-size: 13px;
  line-height: 1.7;
  color: var(--text-gray);
  white-space: pre-wrap;
  word-break: break-word;
  padding: 0 14px;
}
.prompt-preview.open {
  max-height: 500px;
  padding: 14px;
  margin-top: 12px;
  border-left-color: var(--red);
}

/* ===== FOOTER ===== */
.footer {
  text-align: center;
  padding: 60px 20px 40px;
  border-top: 1px solid #111;
}
.footer-brand {
  font-family: var(--font-accent);
  font-size: 24px;
  letter-spacing: 3px;
  margin-bottom: 12px;
}
.footer-brand span { color: var(--red); }
.footer-links {
  font-size: 14px;
  color: var(--text-dim);
  margin-bottom: 16px;
}
.footer-links a {
  color: var(--text-gray);
  text-decoration: none;
  transition: color 0.2s;
}
.footer-links a:hover { color: var(--royal-blue); }
.footer-copy {
  font-size: 12px;
  color: var(--text-dim);
}

/* ===== RESPONSIVE ===== */
@media (max-width: 768px) {
  .top-bar { padding: 14px 20px; }
  .top-bar .brand { font-size: 22px; }
  .accordion-body-inner {
    grid-template-columns: 1fr;
  }
  .accordion-header { padding: 14px 16px; gap: 12px; }
  .accordion-title { font-size: 17px; }
  .sticky-header { padding: 10px 20px; }
  .sticky-header .title { display: none; }
  .modal { padding: 30px; }
  .hero { padding: 70px 16px 40px; }
}
@media (max-width: 480px) {
  .top-bar .brand { font-size: 18px; letter-spacing: 1px; }
  .btn-guide { padding: 6px 12px; font-size: 12px; }
  .prompt-card { padding: 16px; }
  .card-title { font-size: 15px; }
  .sticky-header .brand { font-size: 16px; }
}

/* ===== REDUCED MOTION ===== */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-delay: 0ms !important;
    transition-duration: 0.01ms !important;
  }
  .hero-line .char { opacity: 1; }
  .hero-sub, .hero-sub-small, .scroll-cta,
  .top-bar .brand, .btn-guide { opacity: 1; }
  .prompt-card { opacity: 1; }
}
</style>
</head>
<body>

<!-- INTRO OVERLAY -->
<div class="intro-overlay" id="introOverlay">
  <div class="intro-counter" id="introCounter">100</div>
  <div class="intro-text">VIBE CODING PROMPTS</div>
  <div class="intro-bar"><div class="intro-bar-fill" id="introBarFill"></div></div>
</div>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="brand">AIC<span>L</span>AB</div>
  <button class="btn-guide" onclick="openModal()">사용법</button>
</div>

<!-- HERO -->
<section class="hero" id="hero">
  <div class="hero-canvas-wrap">
    <canvas id="spiralCanvas"></canvas>
  </div>
  <div class="hero-img-overlay"></div>
  <h1 class="hero-title">
    <span class="hero-line" data-text="코딩 몰라도 된다."></span>
    <span class="hero-line" data-text="붙여넣기만 하면"></span>
    <span class="hero-line accent" data-text="웹앱이 나온다."></span>
  </h1>
  <p class="hero-sub">바이브 코딩 시작 프롬프트 100선</p>
  <p class="hero-sub-small">AI 시대, 누구나 개발자 &mdash; AICLab</p>
  <div class="scroll-cta">
    <a href="#content">
      프롬프트 둘러보기
      <span class="arrow">&#9660;</span>
    </a>
  </div>
</section>

<!-- STICKY HEADER -->
<div class="sticky-header" id="stickyHeader">

// ===== INTRO SEQUENCE =====
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

async function runIntroSequence() {
  const overlay = document.getElementById('introOverlay');
  const counter = document.getElementById('introCounter');
  const barFill = document.getElementById('introBarFill');

  // Phase 1: 카운트다운 100 → 0 (빠르게)
  const steps = [100, 87, 73, 60, 48, 35, 21, 10, 5, 3, 1, 0];
  for (let i = 0; i < steps.length; i++) {
    counter.textContent = steps[i];
    barFill.style.width = ((steps.length - 1 - i) / (steps.length - 1) * 100) + '%';
    await sleep(120);
  }
  await sleep(300);

  // Phase 2: 오버레이 페이드아웃
  overlay.classList.add('fade-out');
  await sleep(600);
  overlay.classList.add('hidden');

  // Phase 3: 히어로 글자 하나씩 등장
  await revealHeroText();
}

async function revealHeroText() {
  // 글자 span 준비
  const lines = document.querySelectorAll('.hero-line');
  const allChars = [];

  lines.forEach((line) => {
    const text = line.dataset.text;
    line.innerHTML = '';
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (ch === ' ') {
        const space = document.createTextNode('\u00A0');
        line.appendChild(space);
      } else {
        const span = document.createElement('span');
        span.className = 'char';
        span.textContent = ch;
        line.appendChild(span);
        allChars.push({ span, line });
      }
    }
  });

  // 한 글자씩 순차 등장
  for (let i = 0; i < allChars.length; i++) {
    allChars[i].span.classList.add('show');
    await sleep(50);
  }

  // 모든 글자 안정화 (settled 상태로 전환 → 애니메이션 제거, 고정)
  await sleep(400);
  allChars.forEach(({ span }) => {
    span.classList.remove('show');
    span.classList.add('settled');
  });

  // 레드 라인 글로우 효과
  const accentLine = document.querySelector('.hero-line.accent');
  if (accentLine) accentLine.classList.add('glow');

  // Phase 4: 서브타이틀 + UI 요소 순차 등장
  await sleep(200);
  document.querySelector('.hero-sub').classList.add('show');
  await sleep(300);
  document.querySelector('.hero-sub-small').classList.add('show');
  await sleep(300);
  document.querySelector('.top-bar .brand').classList.add('show');
  await sleep(150);
  document.querySelector('.btn-guide').classList.add('show');
  await sleep(150);
  document.querySelector('.scroll-cta').classList.add('show');
}

// ===== SPIRAL ANIMATION ENGINE =====
const Spiral = (() => {
  let canvas, ctx, dpr, W, H, size;
  let time = 0, animId = null;
  let stars = [];
  const NUM_STARS = 5000;
  const TRAIL = 80;
  const CAM_Z = -400;
  const CAM_TRAVEL = 3400;
  const DOT_Y_OFF = 28;
  const VIEW_ZOOM = 100;
  const CHANGE_T = 0.32;
  let speed = 1;
  let startTime = null;

  function ease(p, g) {
    return p < 0.5 ? 0.5 * Math.pow(2 * p, g) : 1 - 0.5 * Math.pow(2 * (1 - p), g);
  }
  function easeOutElastic(x) {
    const c4 = (2 * Math.PI) / 4.5;
    if (x <= 0) return 0; if (x >= 1) return 1;
    return Math.pow(2, -8 * x) * Math.sin((x * 8 - 0.75) * c4) + 1;
  }
  function map(v, a, b, c, d) { return c + (d - c) * ((v - a) / (b - a)); }
  function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), hi); }
  function lerp(a, b, t) { return a * (1 - t) + b * t; }

  function spiralPath(p) {
    p = clamp(1.2 * p, 0, 1);
    p = ease(p, 1.8);
    const turns = 6, theta = 2 * Math.PI * turns * Math.sqrt(p), r = 170 * Math.sqrt(p);
    return { x: r * Math.cos(theta), y: r * Math.sin(theta) + DOT_Y_OFF };
  }

  function projectDot(pos3, sf) {
    const t2 = clamp(map(time, CHANGE_T, 1, 0, 1), 0, 1);
    const camZ = CAM_Z + ease(Math.pow(t2, 1.2), 1.8) * CAM_TRAVEL;
    if (pos3.z > camZ) {
      const depth = pos3.z - camZ;
      const x = VIEW_ZOOM * pos3.x / depth;
      const y = VIEW_ZOOM * pos3.y / depth;
      const sw = 400 * sf / depth;
      ctx.beginPath();
      ctx.arc(x, y, Math.max(sw / 2, 0.3), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  class Star {
    constructor() {
      this.angle = Math.random() * Math.PI * 2;
      this.dist = 30 * Math.random() + 15;
      this.rotDir = Math.random() > 0.5 ? 1 : -1;
      this.expRate = 1.2 + Math.random() * 0.8;
      this.finalScale = 0.7 + Math.random() * 0.6;
      this.dx = this.dist * Math.cos(this.angle);
      this.dy = this.dist * Math.sin(this.angle);
      this.spiralLoc = (1 - Math.pow(1 - Math.random(), 3)) / 1.3;
      this.z = lerp(
        CAM_Z * 0.5 + Math.random() * (CAM_TRAVEL + CAM_Z * 0.5),
        CAM_TRAVEL / 2,
        0.3 * this.spiralLoc
      );
      this.swf = Math.pow(Math.random(), 2);
    }
    render() {
      const sp = spiralPath(this.spiralLoc);
      const q = time / (1 / speed) - this.spiralLoc;
      if (q <= 0) return;
      const dp = clamp(4 * q, 0, 1);
      const lin = dp, elast = easeOutElastic(dp), pw = dp * dp;
      let eg;
      if (dp < 0.3) eg = lerp(lin, pw, dp / 0.3);
      else if (dp < 0.7) eg = lerp(pw, elast, (dp - 0.3) / 0.4);
      else eg = elast;

      let sx, sy;
      if (dp < 0.3) {
        sx = lerp(sp.x, sp.x + this.dx * 0.3, eg / 0.3);
        sy = lerp(sp.y, sp.y + this.dy * 0.3, eg / 0.3);
      } else if (dp < 0.7) {
        const mp = (dp - 0.3) / 0.4;
        const cs = Math.sin(mp * Math.PI) * this.rotDir * 1.5;
        const bx = sp.x + this.dx * 0.3, by = sp.y + this.dy * 0.3;
        const tx = sp.x + this.dx * 0.7, ty = sp.y + this.dy * 0.7;
        sx = lerp(bx, tx, mp) + (-this.dy * 0.4 * cs) * mp;
        sy = lerp(by, ty, mp) + (this.dx * 0.4 * cs) * mp;
      } else {
        const fp = (dp - 0.7) / 0.3;
        const bx = sp.x + this.dx * 0.7, by = sp.y + this.dy * 0.7;
        const td = this.dist * this.expRate * 1.5;
        const sa = this.angle + 1.2 * this.rotDir * fp * Math.PI;
        const tx = sp.x + td * Math.cos(sa), ty = sp.y + td * Math.sin(sa);
        sx = lerp(bx, tx, fp);
        sy = lerp(by, ty, fp);
      }

      const vx = (this.z - CAM_Z) * sx / VIEW_ZOOM;
      const vy = (this.z - CAM_Z) * sy / VIEW_ZOOM;
      let sm = dp < 0.6 ? 1 + dp * 0.2 : lerp(1.2, this.finalScale, (dp - 0.6) / 0.4);
      projectDot({ x: vx, y: vy, z: this.z }, 8.5 * this.swf * sm);
    }
  }

  function drawTrail() {
    const t1 = clamp(map(time, 0, CHANGE_T + 0.25, 0, 1), 0, 1);
    for (let i = 0; i < TRAIL; i++) {
      const f = map(i, 0, TRAIL, 1.1, 0.1);
      const sw = (1.3 * (1 - t1) + 3 * Math.sin(Math.PI * t1)) * f;
      const pt = t1 - 0.00015 * i;
      const p = spiralPath(pt);
      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(sw / 2, 0.3), 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function render(ts) {
    if (!startTime) startTime = ts;
    const elapsed = (ts - startTime) / 1000;
    time = (elapsed * speed / 15) % 1;

    ctx.fillStyle = 'black';
    ctx.fillRect(0, 0, size, size);
    ctx.save();
    ctx.translate(size / 2, size / 2);

    const t1 = clamp(map(time, 0, CHANGE_T + 0.25, 0, 1), 0, 1);
    const t2 = clamp(map(time, CHANGE_T, 1, 0, 1), 0, 1);
    ctx.rotate(-Math.PI * ease(t2, 2.7));

    ctx.fillStyle = 'white';
    drawTrail();
    for (const s of stars) s.render();

    // start dot
    if (time > CHANGE_T) {
      const dy = CAM_Z * DOT_Y_OFF / VIEW_ZOOM;
      projectDot({ x: 0, y: dy, z: CAM_TRAVEL }, 2.5);
    }

    ctx.restore();
    animId = requestAnimationFrame(render);
  }

  function init() {
    canvas = document.getElementById('spiralCanvas');
    if (!canvas) return;
    ctx = canvas.getContext('2d');
    dpr = window.devicePixelRatio || 1;
    resize();

    // seeded random for stars
    const origRandom = Math.random;
    let seed = 1234;
    Math.random = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    for (let i = 0; i < NUM_STARS; i++) stars.push(new Star());
    Math.random = origRandom;

    animId = requestAnimationFrame(render);
    window.addEventListener('resize', resize);
  }

  function resize() {
    const hero = document.getElementById('hero');
    W = hero.offsetWidth;
    H = hero.offsetHeight;
    size = Math.max(W, H);
    canvas.width = size * dpr;
    canvas.height = size * dpr;
    canvas.style.width = size + 'px';
    canvas.style.height = size + 'px';
    if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function destroy() {
    if (animId) cancelAnimationFrame(animId);
    window.removeEventListener('resize', resize);
  }

  return { init, destroy };
})();

// ===== STICKY HEADER =====
function initStickyHeader() {
  const hero = document.getElementById('hero');
  const sticky = document.getElementById('stickyHeader');
  const observer = new IntersectionObserver(
    ([entry]) => {
      sticky.classList.toggle('visible', !entry.isIntersecting);
    },
    { threshold: 0, rootMargin: '-80px 0px 0px 0px' }
  );
  observer.observe(hero);
}

// ===== SECTION COUNT ANIMATION =====
function initSectionCount() {
  const el = document.getElementById('sectionCount');
  const observer = new IntersectionObserver(
    ([entry]) => {
      if (entry.isIntersecting) {
        el.classList.add('visible');
        observer.disconnect();
      }
    },
    { threshold: 0.5 }
  );
  observer.observe(el);
}

// ===== ACCORDION =====
function renderAccordion() {
  const container = document.getElementById('accordionContainer');
  categories.forEach((cat, catIdx) => {
    const item = document.createElement('div');
    item.className = 'accordion-item';

    const header = document.createElement('div');
    header.className = 'accordion-header';
    header.innerHTML = `
      <div class="accordion-icon"></div>
      <div class="accordion-title">${cat.name}</div>
      <div class="accordion-count">${cat.count}</div>
      <div class="accordion-arrow">&#9654;</div>
    `;

    const body = document.createElement('div');
    body.className = 'accordion-body';
    const inner = document.createElement('div');
    inner.className = 'accordion-body-inner';

    cat.prompts.forEach((p, pIdx) => {
      const card = document.createElement('div');
      card.className = 'prompt-card';
      card.dataset.level = p.level;
      const badgeClass = p.level === '쉬움' ? 'badge-easy' : 'badge-normal';
      const numStr = String(p.id).padStart(2, '0');

      card.innerHTML = `
        <div class="card-top">
          <span class="badge ${badgeClass}">${p.level}</span>
          <span class="card-number">#${numStr}</span>
        </div>
        <div class="card-title">${p.title}</div>
        <div class="card-desc">${p.desc}</div>
        <div class="card-actions">
          <button class="btn-preview" onclick="togglePreview(this)">
            &#9662; 미리보기
          </button>
          <button class="btn-copy" onclick="copyPrompt(this, ${catIdx}, ${pIdx})">
            <span class="copy-icon">&#128203;</span> 복사
          </button>
        </div>
        <div class="prompt-preview">${p.prompt}</div>
      `;
      inner.appendChild(card);
    });

    body.appendChild(inner);
    item.appendChild(header);
    item.appendChild(body);
    container.appendChild(item);

    header.addEventListener('click', () => toggleAccordion(header, body, inner));
  });
}

function toggleAccordion(header, body, inner) {
  const isOpen = header.classList.contains('active');

  if (isOpen) {
    header.classList.remove('active');
    body.style.maxHeight = '0';
  } else {
    header.classList.add('active');
    body.style.maxHeight = inner.scrollHeight + 40 + 'px';

    // stagger card reveal
    const cards = inner.querySelectorAll('.prompt-card');
    cards.forEach((card, i) => {
      card.classList.remove('revealed');
      card.style.animationDelay = `${i * 0.04}s`;
      // force reflow
      void card.offsetWidth;
      card.classList.add('revealed');
    });
  }
}

// ===== TOGGLE ALL =====
let allOpen = false;
function toggleAll() {
  allOpen = !allOpen;
  const btn = document.getElementById('btnToggleAll');
  btn.textContent = allOpen ? '전체 접기' : '전체 펼치기';

  document.querySelectorAll('.accordion-item').forEach(item => {
    const header = item.querySelector('.accordion-header');
    const body = item.querySelector('.accordion-body');
    const inner = item.querySelector('.accordion-body-inner');

    if (allOpen) {
      header.classList.add('active');
      body.style.maxHeight = inner.scrollHeight + 40 + 'px';
      inner.querySelectorAll('.prompt-card').forEach((card, i) => {
        card.classList.remove('revealed');
        card.style.animationDelay = `${i * 0.02}s`;
        void card.offsetWidth;
        card.classList.add('revealed');
      });
    } else {
      header.classList.remove('active');
      body.style.maxHeight = '0';
    }
  });
}

// ===== PREVIEW =====
function togglePreview(btn) {
  const card = btn.closest('.prompt-card');
  const preview = card.querySelector('.prompt-preview');
  const isOpen = preview.classList.contains('open');

  if (isOpen) {
    preview.classList.remove('open');
    btn.classList.remove('active');
    btn.innerHTML = '&#9662; 미리보기';
  } else {
    preview.classList.add('open');
    btn.classList.add('active');
    btn.innerHTML = '&#9652; 접기';
  }

  // 아코디언 높이 재계산
  const accordionBody = card.closest('.accordion-body');
  const inner = accordionBody.querySelector('.accordion-body-inner');
  if (accordionBody) {
    setTimeout(() => {
      accordionBody.style.maxHeight = inner.scrollHeight + 40 + 'px';
    }, 50);
  }
}

// ===== COPY =====
function copyPrompt(btn, catIdx, pIdx) {
  const p = categories[catIdx].prompts[pIdx];
  const text = p.prompt;
  navigator.clipboard.writeText(text).then(() => {
    const toast = document.createElement('span');
    toast.className = 'copy-toast';
    toast.textContent = '복사 완료!';
    btn.appendChild(toast);
    setTimeout(() => toast.remove(), 800);
  });
}

// ===== MODAL =====
function openModal() {
  document.getElementById('modal').classList.add('active');
}
function closeModal() {
  document.getElementById('modal').classList.remove('active');
}
document.getElementById('modal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeModal();
});

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
  initStickyHeader();
  initSectionCount();
  renderAccordion();
  Spiral.init();
  runIntroSequence();
});
</script>
</body>
</html>
